# Vérifications obligatoires avant toute fusion dans main : formatage, tests, compilation stricte.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatage (swift format)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Sélectionner la version d'Xcode la plus récente
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Vérifier le formatage et les règles de style
        run: scripts/lint.sh

  tests:
    name: Tests (AmploDSP)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Sélectionner la version d'Xcode la plus récente
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Tests
        run: swift test --package-path Packages/AmploDSP
      - name: Tests sous Address Sanitizer (accès mémoire invalides)
        run: swift test --package-path Packages/AmploDSP --sanitize=address

  build:
    name: Compilation de l'app (avertissements bloquants)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Sélectionner la version d'Xcode la plus récente
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Compiler
        run: AMPLO_ADHOC=1 ./build.sh
