# Compile Amplo et produit le .zip et le .dmg (signature ad hoc, non notarisés).
# - tag v* poussé : signe le .zip pour Sparkle (secret SPARKLE_PRIVATE_KEY), génère appcast.xml
#   et crée la Release GitHub avec les trois fichiers ;
# - pull request ou lancement manuel : simple vérification, fichiers en artefacts.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Sélectionner la version d'Xcode la plus récente
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Construire le .zip et le .dmg
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.0-dev.$GITHUB_RUN_NUMBER"; fi
          scripts/package.sh "$version" "$GITHUB_RUN_NUMBER"

      - name: Signer la mise à jour Sparkle et générer l'appcast
        if: github.ref_type == 'tag'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then echo "::error::Secret SPARKLE_PRIVATE_KEY manquant"; exit 1; fi
          mkdir -p build/appcast
          cp dist/*.zip build/appcast/
          echo "$SPARKLE_PRIVATE_KEY" | build/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            --link "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            -o dist/appcast.xml build/appcast
          cat dist/appcast.xml
          # Sans signature, les apps installées refuseraient la mise à jour.
          if ! grep -q 'sparkle:edSignature' dist/appcast.xml; then
            echo "::error::Appcast non signé : SPARKLE_PRIVATE_KEY ne correspond pas à SUPublicEDKey (Info.plist)"
            exit 1
          fi

      - name: Publier la release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Amplo ${GITHUB_REF_NAME#v}" \
            --notes-file Support/release-notes.md \
            --generate-notes

      - name: Conserver les fichiers
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Amplo
          path: dist/*
